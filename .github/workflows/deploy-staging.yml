name: Deploy a staging (VPS)

on:
  push:
    branches: [staging]
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, gympro-vps]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Asegurar rsync en el runner
        run: command -v rsync >/dev/null || (apt-get update && apt-get install -y rsync)

      - name: Sincronizar codigo con el clon persistente del VPS
        run: |
          mkdir -p ~/GymPro-Staging/gympro-infra
          rsync -a --delete --exclude='.env' --exclude='.git' --exclude='uploads/' --exclude='backups/' ./ ~/GymPro-Staging/gympro-infra/

      - name: Reconstruir stack de staging
        run: |
          cd ~/GymPro-Staging/gympro-infra
          # -p gympro-staging: mismo nombre de proyecto que el stack que ya corre
          # en el VPS (creado manualmente antes de este pipeline), para que Compose
          # actualice esos contenedores en vez de crear un proyecto paralelo.
          # -f explicitos: mismo par de archivos que ya usa ese stack
          # (docker-compose.yml + docker-compose.override.yml), declarado a mano
          # en vez de depender de la fusion automatica implicita de Compose.
          docker compose -p gympro-staging -f docker-compose.yml -f docker-compose.override.yml up -d --build

      - name: Estado de los contenedores
        run: |
          cd ~/GymPro-Staging/gympro-infra
          sleep 5
          docker compose -p gympro-staging -f docker-compose.yml -f docker-compose.override.yml ps
